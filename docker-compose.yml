version: "3.8"
services:
  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=payment
      - DB_PASSWORD=payment_secret
      - DB_NAME=payment_gateway
      - REDIS_ADDR=redis:6379
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_secret
      POSTGRES_DB: payment_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/transaction-service/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
